name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # create the Release
  id-token: write        # mint OIDC token for attestation
  attestations: write    # store the provenance attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: >
          dotnet publish EolInspector.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "publish/EolInspector.exe"
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  EolInspector.exe" |
            Out-File -Encoding ascii publish/EolInspector.exe.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: publish/EolInspector.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/EolInspector.exe
            publish/EolInspector.exe.sha256
